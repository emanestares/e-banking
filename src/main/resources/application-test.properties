# ============================================================
# Mini Banking System - Test Environment (H2 In-Memory)
# ============================================================

# --- Server ---
server.port=8080
server.servlet.context-path=/api

# --- H2 In-Memory Database ---
# MODE=MSSQLServer helps maintain compatibility with your original SQL Server syntax
spring.datasource.url=jdbc:h2:mem:MiniBankingDB;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=admin

# --- H2 Console Access ---
# Accessible at http://localhost:8080/api/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# --- JPA / Hibernate ---
# 'update' will automatically create your tables in the H2 memory
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
app.jwt.secret=MiniBankingSystemSecretKey2024XYZ!SecureEnoughForHS256
app.jwt.expiration-ms=86400000

# --- CORS ---
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000

# --- Logging ---
://level.com.bankingsystem=DEBUG
logging.level.org.springframework.security=INFO