# ============================================================
# Mini Banking System - TEST PROFILE (H2 In-Memory)
# ============================================================

# --- Server ---
server.port=0
server.servlet.context-path=/api

# --- H2 Database ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


# --- H2 Console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
app.jwt.secret=MiniBankingSystemSecretKey2024XYZ!SecureEnoughForHS256
app.jwt.expiration-ms=86400000

# --- CORS ---
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000

# --- Logging ---
logging.level.com.bankingsystem=DEBUG
logging.level.org.springframework.security=INFO